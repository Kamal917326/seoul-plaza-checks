<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Seoul Plaza Checks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Gothic+A1:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app column, sticky header, fixed bottom tabs, bottom sheets for every form. Celadon accent from Korean pottery. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E7EDEA; --ink:#17201D; --muted:#5A6964; --line:#D3DCD8;
  --accent:#2C7A68; --accent-ink:#FFFFFF; --accent-soft:#DCEDE7;
  --warn:#A86200; --warn-soft:#FBEED6; --bad:#BF3328; --bad-soft:#F8DFDB;
  --shadow:0 1px 2px rgba(20,40,34,.06),0 8px 24px rgba(20,40,34,.08);
  --f-display:"Bricolage Grotesque","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201E; --surface-2:#1E2A27; --ink:#E5EDE9; --muted:#93A39D; --line:#2A3834;
  --accent:#6CC2AB; --accent-ink:#0A1613; --accent-soft:#1B3831;
  --warn:#E6A64C; --warn-soft:#382B15; --bad:#F07A6E; --bad-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201E; --surface-2:#1E2A27; --ink:#E5EDE9; --muted:#93A39D; --line:#2A3834;
  --accent:#6CC2AB; --accent-ink:#0A1613; --accent-soft:#1B3831;
  --warn:#E6A64C; --warn-soft:#382B15; --bad:#F07A6E; --bad-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1;font-weight:700;text-wrap:balance}
.chip-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-weight:500;font-size:14px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.demo button{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2,.sec-h{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;text-wrap:balance}
.sec-h{margin-top:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h a,.link{color:var(--accent);font-family:var(--f-body);font-size:13px;font-weight:700;text-decoration:none;background:none;border:0;padding:0}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.hero{background:var(--accent);color:var(--accent-ink);border:0;box-shadow:var(--shadow)}
.hero .label{color:inherit;opacity:.8}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .big{font-family:var(--f-data);font-size:40px;font-weight:700;line-height:1}
.bar{height:8px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-data);font-size:24px;font-weight:700;margin-top:2px}
.stat span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{font-size:12.5px;color:var(--muted)}
.att{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:10px;border:0;width:100%;text-align:left;background:var(--surface-2)}
.att + .att{margin-top:8px}
.att .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.att.bad{background:var(--bad-soft)} .att.bad .dot{background:var(--bad)}
.att.warn{background:var(--warn-soft)} .att.warn .dot{background:var(--warn)}
.att.ok .dot{background:var(--accent)}
.att .t{font-weight:500;font-size:14px}
.att .s{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.p-ok{background:var(--accent-soft);color:var(--accent)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.temp{font-family:var(--f-data);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.t-ok{color:var(--accent)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:700;font-size:14px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.grid{border-collapse:collapse;width:100%;min-width:480px;font-size:13px}
.grid th,.grid td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:500}
.grid th{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.grid td.c{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:700}
.cell-bad{color:var(--bad)} .cell-ok{color:var(--accent)} .cell-warn{color:var(--warn)} .cell-mute{color:var(--muted);font-weight:400!important}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px}
.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(8,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-h h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;text-wrap:balance}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > span{font-size:13px;font-weight:700}
.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.temp-in{display:flex;align-items:center;gap:8px}
.temp-in input{font-family:var(--f-data);font-size:34px;font-weight:700;text-align:center;flex:1;min-width:0;padding:8px}
.temp-in .btn{min-width:52px;font-size:18px}
.verdict{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.v-ok{background:var(--accent-soft);color:var(--accent)} .v-bad{background:var(--bad-soft);color:var(--bad)} .v-warn{background:var(--warn-soft);color:var(--warn)}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.choice input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.choice b{font-weight:500}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.scan{display:flex;gap:8px;margin-bottom:12px}
.scan input{font-family:var(--f-data)}
.line{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.line.ticked{border-color:var(--accent)}
.line.rej{border-color:var(--bad)}
.line.flash{animation:flash 1s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.line.flash{animation:none}}
.line-top{display:flex;gap:10px;align-items:flex-start}
.tick{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;color:var(--accent-ink);font-weight:700}
.line.ticked .tick{background:var(--accent);border-color:var(--accent)}
.line-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.line-f label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.line-f .input{min-height:40px;padding:8px 10px}
.line-f .full{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"].acc{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].rej{background:var(--bad);color:#fff}
.sig{width:100%;height:150px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);touch-action:none;display:block}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:12px}
.chart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.chart i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.chart i.zero{background:var(--line)}
.chart span{font-size:11px;color:var(--muted)}
.chart em{font-style:normal;font-family:var(--f-data);font-size:10.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.simple{border-collapse:collapse;width:100%;font-size:13px}
.simple th,.simple td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.simple th{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.simple td.n{font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.simple th.n{text-align:right}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.err{color:var(--bad);font-size:13px;font-weight:500;margin:4px 0 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><small>Seoul Plaza</small><h1 id="pageTitle">Today</h1></div>
    <button class="chip-btn" data-act="staff" aria-label="Switch staff member"><span class="avatar" id="meInit">H</span><span id="meName">kamal </span></button>
  </header>
  <div class="demo"><span>Prototype with example data. Nothing here is real shop records.</span><button data-act="reset">Reset demo</button></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Today<span class="badge" id="b-today" hidden></span></button>
  <button data-tab="hot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13.5V5a2 2 0 1 1 4 0v8.5a4 4 0 1 1-4 0Z"/><path d="M12 9v6.5"/></svg>Hot food<span class="badge" id="b-hot" hidden></span></button>
  <button data-tab="deliveries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg>Deliveries</button>
  <button data-tab="dates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Dates<span class="badge" id="b-dates" hidden></span></button>
</div></nav>

<div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>dstr(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=ds=>{const d=new Date(ds+'T00:00');return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const money=n=>'£'+(+n).toFixed(2);
const uid=()=>Math.random().toString(36).slice(2,9);
const daysUntil=ds=>Math.round((new Date(ds+'T00:00')-new Date(todayStr()+'T00:00'))/864e5);

/* ---------- reference data (examples) ---------- */
const SLOTS=['10:00','12:00','14:00','16:00','18:00','20:00'];
const HOT_MIN=63;
const SUP=[
 {id:'hanriver',name:'Han River Foods',kind:'Korean grocery',items:[
  ['8801043014809','Instant ramen 5-pack','ambient','bbd','Aisle A2',4.2,12],
  ['8801007160344','Gochujang 500g','ambient','bbd','Aisle A3',2.9,10],
  ['8801045522678','Kimchi 1kg','chilled','bbd','Chiller 1',4.5,8],
  ['8801067100212','Tteokbokki rice cakes 500g','chilled','useby','Chiller 1',1.8,15],
  ['8801073110489','Seaweed snack 10-pack','ambient','bbd','Aisle A4',2.1,10]]},
 {id:'northfield',name:'Northfield Meats',kind:'Meat for hot counter',items:[
  ['5012345000011','Pork shoulder, sliced 5kg','chilled','useby','Kitchen fridge',27,2],
  ['5012345000028','Beef rib-eye, sliced 5kg','chilled','useby','Kitchen fridge',48,2],
  ['5012345000035','Chicken thigh 10kg','chilled','useby','Kitchen fridge',34,3],
  ['5012345000042','Frozen corn dogs 40pc','frozen','bbd','Kitchen freezer',22,2]]},
 {id:'goldenbean',name:'Golden Bean Tofu',kind:'Tofu and fresh veg',items:[
  ['5060111220018','Firm tofu 400g','chilled','useby','Chiller 2',0.9,24],
  ['5060111220025','Soft tofu 300g','chilled','useby','Chiller 2',0.8,12],
  ['5060111220032','Bean sprouts 500g','chilled','useby','Chiller 2',0.7,10]]},
 {id:'sakura',name:'Sakura Imports',kind:'Japanese grocery',items:[
  ['4901005200124','Japanese mayonnaise 500g','ambient','bbd','Aisle B1',3.1,12],
  ['4902102072618','Frozen udon 5-pack','frozen','bbd','Freezer 1',3.4,10],
  ['4901330571234','Chocolate biscuit sticks','ambient','bbd','Aisle B2',0.9,30]]},
 {id:'goldendragon',name:'Golden Dragon Wholesale',kind:'Chinese grocery',items:[
  ['6901234567892','Chilli crisp oil 210g','ambient','bbd','Aisle C1',2.2,12],
  ['6902345678901','Frozen pork dumplings 1kg','frozen','bbd','Freezer 1',4.6,10],
  ['6903456789012','Fresh egg noodles 500g','chilled','useby','Chiller 1',1.1,12]]}
];
const supById=id=>SUP.find(s=>s.id===id);
const itemOf=(sup,sku)=>{const r=supById(sup).items.find(i=>i[0]===sku);return {sku:r[0],name:r[1],storage:r[2],dateType:r[3],aisle:r[4],cost:r[5],ordered:r[6]}};
const tempLimit=st=>st==='chilled'?8:st==='frozen'?-15:null;

const LS='seoul-plaza-checks-v1';
let S=null;
try{const raw=localStorage.getItem(LS);if(raw){S=JSON.parse(raw);if(S.day!==todayStr())S=null}}catch(e){S=null}

function slotTime(i,base=new Date()){const [h,m]=SLOTS[i].split(':').map(Number);const d=new Date(base);d.setHours(h,m,0,0);return d}
function curSlot(now=new Date()){let c=-1;SLOTS.forEach((s,i)=>{if(slotTime(i,now)<=now)c=i});return c}

function seed(){
 const now=new Date(),today=dstr(now);
 const staff=['kamal ','Ji-woo','Mei','Tom'];
 const hotItems=[
  {id:'pork',name:'Spicy pork',tray:18},{id:'beef',name:'Beef bulgogi',tray:24},
  {id:'tofu',name:'Braised tofu',tray:8},{id:'corndog',name:'Corn dogs',tray:12},
  {id:'ch1',name:'Yangnyeom chicken',tray:16},{id:'ch2',name:'Soy garlic chicken',tray:16},
  {id:'ch3',name:'Honey butter chicken',tray:16},{id:'ch4',name:'Original fried chicken',tray:15}];
 const hot=[];const cur=curSlot(now);
 for(let i=0;i<=cur;i++)hotItems.forEach((it,j)=>{
  if(i===cur&&j>=3)return;
  let temp=+(66+((i*7+j*5)%11)+((i+j)%10)/10).toFixed(1),action=null;
  if(i===1&&it.id==='corndog'&&cur>=2){temp=59.6;action={type:'reheat',recheck:78.4}}
  let t=slotTime(i,now);t.setMinutes(t.getMinutes()+2+j*2);if(t>now)t=now;
  hot.push({id:uid(),item:it.id,slot:i,date:today,temp,action,staff:staff[(i+j)%4],ts:hm(t)});
 });
 const mkDel=(daysAgo,sup,time,issues,staffName)=>{
  const s=supById(sup);
  const lines=s.items.map(r=>{const it=itemOf(sup,r[0]);const lim=tempLimit(it.storage);
   const l={...it,ticked:true,received:it.ordered,temp:lim===null?'':(it.storage==='frozen'?-19.2:3.4),date:addDays(-daysAgo+(it.dateType==='useby'?5:120)),decision:'accept'};
   (issues||[]).forEach(x=>{if(x.sku!==it.sku)return;if(x.short)l.received=it.ordered-x.short;if(x.warm!=null){l.temp=x.warm;l.decision='reject'}if(x.t!=null)l.temp=x.t});
   return l});
  return {id:uid(),sup,date:addDays(-daysAgo),time,staff:staffName,lines,checks:{pack:true,van:true,pests:true,invoice:true},photo:null,notes:'',signed:true};
 };
 const deliveries=[
  mkDel(0,'northfield','08:40',[{sku:'5012345000035',t:6.8}],'Tom'),
  mkDel(1,'hanriver','10:15',[{sku:'8801073110489',short:4}],'Mei'),
  mkDel(2,'goldenbean','09:05',[],'kamal '),
  mkDel(4,'goldendragon','11:30',[],'Ji-woo'),
  mkDel(5,'goldenbean','09:20',[{sku:'5060111220018',warm:9.4}],'Tom'),
  mkDel(7,'northfield','08:35',[],'Mei'),
  mkDel(8,'sakura','13:10',[{sku:'4901330571234',short:6}],'Ji-woo'),
  mkDel(9,'hanriver','10:40',[],'kamal '),
  mkDel(12,'goldenbean','09:10',[{sku:'5060111220032',warm:10.1}],'Mei'),
  mkDel(14,'northfield','08:50',[{sku:'5012345000035',short:1}],'Tom'),
  mkDel(16,'goldendragon','12:00',[],'Ji-woo'),
  mkDel(19,'goldenbean','09:00',[],'kamal ')];
 const B=(name,qty,dateType,d,aisle,cost,status='active')=>({id:uid(),name,qty,dateType,date:addDays(d),aisle,cost,status,checked:null});
 const batches=[
  B('Firm tofu 400g',6,'useby',-1,'Chiller 2',0.9),
  B('Bean sprouts 500g',4,'useby',0,'Chiller 2',0.7),
  B('Soft tofu 300g',5,'useby',1,'Chiller 2',0.8,'reduced'),
  B('Tteokbokki rice cakes 500g',9,'useby',2,'Chiller 1',1.8),
  B('Pork shoulder, sliced 5kg',1,'useby',3,'Kitchen fridge',27),
  B('Fresh egg noodles 500g',7,'useby',4,'Chiller 1',1.1),
  B('Chicken thigh 10kg',2,'useby',4,'Kitchen fridge',34),
  B('Chocolate biscuit sticks',11,'bbd',-9,'Aisle B2',0.9),
  B('Kimchi 1kg',5,'bbd',6,'Chiller 1',4.5),
  B('Seaweed snack 10-pack',8,'bbd',12,'Aisle A4',2.1),
  B('Japanese mayonnaise 500g',10,'bbd',25,'Aisle B1',3.1),

 const W=(d,name,qty,val,reason,st)=>({id:uid(),date:addDays(-d),name,qty,value:val,reason,staff:st});
 const waste=[W(1,'Bean sprouts 500g',4,0.7,'Past use-by','Mei'),W(2,'Original fried chicken (tray)',1,15,'Hot hold below 63°C','Tom'),
  W(3,'Corn dogs (tray)',1,12,'End of day','kamal '),W(4,'Kimchi 1kg',1,4.5,'Damaged','Ji-woo'),W(6,'Firm tofu 400g',6,0.9,'Past use-by','Tom'),
  W(9,'Tteokbokki rice cakes 500g',3,1.8,'Past use-by','Mei'),W(12,'Chocolate biscuit sticks',5,0.9,'Past best before','kamal ')];
 return {day:today,staff,me:'kamal ',hotItems,hot,deliveries,batches,waste};

/* ---------- derived ---------- */
const findCheck=(item,i)=>S.hot.find(c=>c.item===item&&c.slot===i&&c.date===todayStr());
function cellState(item,i){
 const c=findCheck(item,i),now=new Date();
 if(c)return c.temp>=HOT_MIN?{k:'ok',c}:{k:'fixed',c};
 const t=slotTime(i),next=new Date(t.getTime()+2*3600e3);
 if(now<t)return{k:'upcoming'};if(now>=next)return{k:'missed'};if(now-t>=30*60e3)return{k:'late'};return{k:'due'};
}
function batchState(b){
 if(b.status==='removed')return'removed';const d=daysUntil(b.date);
 if(b.dateType==='useby'){if(d<0)return'block';if(d===0)return'today';if(d<=3)return'soon';if(d<=7)return'week';return'ok'}
 if(d<0)return'pastbbd';if(d<=3)return'soon';if(d<=7)return'week';return'ok';
}
function lineIssues(l){
 const o=[];if(!l.ticked){o.push('missing');return o}
 if(l.decision==='reject')o.push('rejected');
 if(+l.received<l.ordered)o.push('short');
 const lim=tempLimit(l.storage);
 if(lim!==null&&l.temp!==''&&l.temp!=null&&+l.temp>lim)o.push('warm');
 return o;
}
function delStats(d){let short=0,rej=0,warm=0,missing=0;d.lines.forEach(l=>{const i=lineIssues(l);if(i.includes('missing'))missing++;if(i.includes('rejected'))rej++;if(i.includes('short'))short++;if(i.includes('warm'))warm++});return{short,rej,warm,missing,issues:short+rej+missing}}
function attention(){
 const a=[],cur=curSlot();
 if(cur>=0){let due=0,late=0;S.hotItems.forEach(it=>{const k=cellState(it.id,cur).k;if(k==='due')due++;if(k==='late'||k==='missed')late++});
  if(late)a.push({lvl:'bad',t:`${late} hot food check${late>1?'s':''} overdue for ${SLOTS[cur]}`,s:'Probe and record now',tab:'hot'});
  else if(due)a.push({lvl:'warn',t:`${due} hot food check${due>1?'s':''} due for ${SLOTS[cur]}`,s:'Due within 30 minutes of the round',tab:'hot'});}
 let missedPast=0;for(let i=0;i<cur;i++)S.hotItems.forEach(it=>{if(cellState(it.id,i).k==='missed')missedPast++});
 if(missedPast)a.push({lvl:'bad',t:`${missedPast} earlier check${missedPast>1?'s':''} missed today`,s:'Add a note for the record',tab:'hot'});
 const act=S.batches.filter(b=>b.status!=='removed');
 const block=act.filter(b=>batchState(b)==='block');
 if(block.length)a.push({lvl:'bad',t:`${block.length} item${block.length>1?'s':''} past use-by still in stock`,s:'Illegal to sell. Remove from sale now',tab:'dates',f:'action'});
 const today=act.filter(b=>batchState(b)==='today'&&b.status!=='reduced');
 if(today.length)a.push({lvl:'warn',t:`${today.length} use-by item${today.length>1?'s':''} on last day of sale`,s:'Reduce to clear or remove at close',tab:'dates',f:'action'});
 const past=act.filter(b=>batchState(b)==='pastbbd'&&b.checked!==todayStr());
 if(past.length)a.push({lvl:'warn',t:`${past.length} item${past.length>1?'s':''} past best before`,s:'Legal to sell if quality is fine. Check it',tab:'dates',f:'action'});
 S.deliveries.filter(d=>d.date===todayStr()).forEach(d=>{const st=delStats(d);if(st.issues)a.push({lvl:'warn',t:`${supById(d.sup).name}: ${[st.short&&st.short+' short',st.rej&&st.rej+' rejected',st.missing&&st.missing+' not delivered'].filter(Boolean).join(', ')}`,s:'Claim credit from the supplier',tab:'deliveries'})});
 return a;
}

/* ---------- rendering ---------- */
let TAB='today',DFILTER='action';
const TITLES={today:'Today',hot:'Hot food log',deliveries:'Deliveries',dates:'Dates & waste'};
function render(){
 document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===TAB?'page':'false'));
 $('#pageTitle').textContent=TITLES[TAB];
 $('#meName').textContent=S.me;$('#meInit').textContent=S.me[0];
 $('#view').innerHTML=({today:vToday,hot:vHot,deliveries:vDeliveries,dates:vDates})[TAB]();
 badges();
}
function badges(){
 const a=attention(),bad=a.filter(x=>x.lvl==='bad').length;
 const set=(id,n)=>{const e=$(id);e.hidden=!n;e.textContent=n};
 set('#b-today',bad);
 const cur=curSlot();let h=0;if(cur>=0)S.hotItems.forEach(it=>{const k=cellState(it.id,cur).k;if(k!=='ok'&&k!=='fixed')h++});
 set('#b-hot',h);
 set('#b-dates',S.batches.filter(b=>['block','today'].includes(batchState(b))||(batchState(b)==='pastbbd'&&b.checked!==todayStr())).length);
}
function nextRoundText(){
 const now=new Date(),cur=curSlot(now);
 if(cur===-1)return`First round at ${SLOTS[0]}`;
 if(cur===SLOTS.length-1)return'Last round of the day';
 const n=slotTime(cur+1),m=Math.max(0,Math.round((n-now)/6e4));
 return`Next round ${SLOTS[cur+1]} · in ${m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min'}`;
}
function hotProgress(){const cur=curSlot();if(cur<0)return{done:0,total:S.hotItems.length,cur};let d=0;S.hotItems.forEach(it=>{if(findCheck(it.id,cur))d++});return{done:d,total:S.hotItems.length,cur}}

 const dels=S.deliveries.filter(d=>d.date===todayStr()).length;

 </div>
 <div class="card"><h2>Inspection ready</h2><p class="small muted" style="margin:6px 0 12px">Every record is time-stamped and signed by name. Show today's full log to an Environmental Health Officer in one tap.</p>
  <button class="btn primary block" data-act="inspect">Open today's food safety record</button></div>
 <p class="small muted" style="text-align:center">${exp7} stock item${exp7===1?'':'s'} reach their date within 7 days</p>`;

function hotCell(it,i){
 const st=cellState(it.id,i);
 if(st.k==='ok')return`<td class="c cell-ok">${st.c.temp.toFixed(1)}</td>`;
 if(st.k==='fixed')return`<td class="c cell-bad" title="Actioned">${st.c.temp.toFixed(1)}*</td>`;
 if(st.k==='missed')return`<td class="c cell-bad">miss</td>`;
 if(st.k==='late')return`<td class="c cell-warn">late</td>`;
 if(st.k==='due')return`<td class="c cell-warn">due</td>`;
 return`<td class="c cell-mute">·</td>`;
}
function vHot(){
 const cur=curSlot(),p=hotProgress();
 const rows=S.hotItems.map(it=>{

  const st=cur>=0?cellState(it.id,cur):{k:'upcoming'};
  const pill={ok:'<span class="pill p-ok">Done</span>',fixed:'<span class="pill p-warn">Actioned</span>',due:'<span class="pill p-warn">Due</span>',late:'<span class="pill p-bad">Overdue</span>',missed:'<span class="pill p-bad">Missed</span>',upcoming:'<span class="pill p-mute">Later</span>'}[st.k];
  const tc=last?(last.temp>=HOT_MIN?'t-ok':'t-bad'):'muted';
  return`<div class="row"><div class="grow"><div class="t">${esc(it.name)}</div><div class="s">${last?`Last ${last.ts} by ${esc(last.staff)}`:'No reading yet today'}</div></div>

   <button class="btn sm ${st.k==='ok'||st.k==='fixed'?'':'primary'}" data-act="rec" data-id="${it.id}" ${cur<0?'disabled':''}>${st.k==='ok'||st.k==='fixed'?'Re-check':'Record'}</button></div>`}).join('');

  </tbody></table></div></div>
 <div class="note">In the shop: a QR code on the counter opens this screen, and a reminder goes to staff phones at each round. A Bluetooth probe can fill the temperature in automatically.</div>`;
}

 if(st==='block')return{p:'p-bad',txt:'Past use-by',sub:`${t} ${fmtD(b.date)} · ${-d} day${d===-1?'':'s'} ago`};
 if(st==='today')return{p:'p-bad',txt:'Last day',sub:`${t} today`};
 if(st==='pastbbd')return{p:'p-warn',txt:'Past best before',sub:`${t} ${fmtD(b.date)} · ${-d} days ago${b.checked===todayStr()?' · quality checked today':''}`};
 if(st==='soon')return{p:'p-warn',txt:`${d} day${d>1?'s':''} left`,sub:`${t} ${fmtD(b.date)}`};
 if(st==='week')return{p:'p-mute',txt:`${d} days left`,sub:`${t} ${fmtD(b.date)}`};

/* hot record */
function sheetRecord(id){
 const it=S.hotItems.find(x=>x.id===id),cur=curSlot();
 const ex=findCheck(id,cur);
 openSheet(head(it.name,`${SLOTS[cur]} round · ${S.me}`)+`
  <div class="field"><span>Core temperature (°C)</span><div class="temp-in"><button class="btn" data-act="tstep" data-d="-0.5" aria-label="Down 0.5">−</button><input id="hotT" class="input" type="number" inputmode="decimal" step="0.1" placeholder="00.0" value="${ex?ex.temp:''}" autofocus><button class="btn" data-act="tstep" data-d="0.5" aria-label="Up 0.5">+</button></div></div>
  <div id="hotV"></div><div id="hotA"></div><div class="err" id="hotErr"></div>
  <button class="btn primary block" data-act="savehot" data-id="${id}">Save reading</button>`,()=>{$('#hotT').addEventListener('input',hotVerdict);hotVerdict()});
}
function hotVerdict(){
 const v=parseFloat($('#hotT').value);const V=$('#hotV'),A=$('#hotA');
 if(isNaN(v)){V.innerHTML='';A.innerHTML='';return}
 if(v>=HOT_MIN){V.innerHTML=`<div class="verdict v-ok">Safe. Holding at ${HOT_MIN}°C or above.</div>`;A.innerHTML='';return}
 V.innerHTML=`<div class="verdict v-bad">Below ${HOT_MIN}°C. Record what you did about it before saving.</div>`;
 if(A.innerHTML)return;
 const until=hm(new Date(Date.now()+2*3600e3));
 A.innerHTML=`<div class="field"><span>Corrective action</span>
  <label class="choice"><input type="radio" name="hotact" value="reheat"><span><b>Reheated to 75°C or above</b><br><span class="small muted">Enter the re-check temperature</span></span></label>
  <div id="reWrap" hidden class="field"><input id="reT" class="input num" type="number" inputmode="decimal" step="0.1" placeholder="Re-check °C"></div>
  <label class="choice"><input type="radio" name="hotact" value="hold2"><span><b>Sell within 2 hours, then discard</b><br><span class="small muted">One 2-hour period below 63°C is allowed. Discard any left at ${until}</span></span></label>
  <label class="choice"><input type="radio" name="hotact" value="discard"><span><b>Discarded</b><br><span class="small muted">Logged as waste automatically</span></span></label></div>`;
 A.querySelectorAll('input[name=hotact]').forEach(r=>r.addEventListener('change',()=>{$('#reWrap').hidden=r.value!=='reheat'||!r.checked}));
}
function saveHot(id){
 const v=parseFloat($('#hotT').value),err=$('#hotErr');err.textContent='';
 if(isNaN(v)||v<0||v>120){err.textContent='Enter the probe reading, for example 68.5';return}
 let action=null;
 if(v<HOT_MIN){const r=document.querySelector('input[name=hotact]:checked');if(!r){err.textContent='Choose the corrective action you took.';return}
  action={type:r.value};
  if(r.value==='reheat'){const re=parseFloat($('#reT').value);if(isNaN(re)||re<75){err.textContent='Re-check must be 75°C or above after reheating.';return}action.recheck=re}
  if(r.value==='hold2')action.until=hm(new Date(Date.now()+2*3600e3));
  if(r.value==='discard'){const it=S.hotItems.find(x=>x.id===id);S.waste.push({id:uid(),date:todayStr(),name:it.name+' (tray)',qty:1,value:it.tray,reason:'Hot hold below 63°C',staff:S.me})}}
 const cur=curSlot();S.hot=S.hot.filter(c=>!(c.item===id&&c.slot===cur&&c.date===todayStr()));
 S.hot.push({id:uid(),item:id,slot:cur,date:todayStr(),temp:v,action,staff:S.me,ts:hm(new Date())});
 save();closeSheet();toast(`Saved ${v.toFixed(1)}°C · ${S.hotItems.find(x=>x.id===id).name}`);
}

/* delivery wizard */
let DW=null;
function newDelivery(){DW={step:1,sup:null,lines:[],checks:{pack:false,van:false,pests:false,invoice:false},photo:null,notes:'',sig:false};drawDW()}
function stepsBar(){return`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=DW.step?'on':''}"></i>`).join('')}</div>`}
function drawDW(){
 if(DW.step===1){openSheet(head('Check in a delivery','Step 1 of 4 · Supplier')+stepsBar()+SUP.map(s=>`<button class="choice" data-act="pick" data-id="${s.id}" style="width:100%;text-align:left"><span style="flex:1"><b>${esc(s.name)}</b><br><span class="small muted">${esc(s.kind)} · ${s.items.length} items on order</span></span><span aria-hidden="true">›</span></button>`).join('')+`<p class="note">Suppliers and order lists here are examples. The shop would add its real suppliers and usual orders once.</p>`);return}
 if(DW.step===2){const done=DW.lines.filter(l=>l.ticked).length;
  openSheet(head(supById(DW.sup).name,`Step 2 of 4 · Items · ${done}/${DW.lines.length} ticked`)+stepsBar()+`
  <div class="scan"><input id="scanIn" class="input" placeholder="Scan or type barcode" inputmode="numeric" autocomplete="off"><button class="btn" data-act="simscan">Demo scan</button></div>
  <p class="small muted" style="margin:-4px 0 12px">The real app uses the phone camera or a handheld scanner. Scanning ticks the line off the order.</p>

 if(DW.step===3){const C=[['pack','Packaging intact, nothing crushed or leaking'],['van','Delivery van clean, chilled goods kept cold'],['pests','No signs of pests'],['invoice','Delivery note matches what arrived']];
  openSheet(head('Arrival checks','Step 3 of 4')+stepsBar()+C.map(([k,t])=>`<label class="choice"><input type="checkbox" data-chk="${k}" ${DW.checks[k]?'checked':''}><b>${t}</b></label>`).join('')+`

  <div class="err" id="dwErr"></div>

   document.querySelectorAll('[data-chk]').forEach(c=>c.addEventListener('change',()=>DW.checks[c.dataset.chk]=c.checked));
   $('#dwNotes').addEventListener('input',e=>DW.notes=e.target.value);
   $('#ph').addEventListener('change',onPhoto)});return}
 if(DW.step===4){const fake={lines:DW.lines};const st=delStats(fake);const acc=DW.lines.filter(l=>l.ticked&&l.decision==='accept').length;
  const failed=Object.entries(DW.checks).filter(([k,v])=>!v).length;
  openSheet(head('Sign and save','Step 4 of 4')+stepsBar()+`

function lineHTML(l,i){
 const lim=tempLimit(l.storage),iss=lineIssues(l);
 const warm=iss.includes('warm');
 const tempHint=lim===null?'':l.storage==='chilled'?'8°C or below':'−15°C or colder';
 const dd=l.date?daysUntil(l.date):null;
 const dateWarn=l.date&&(l.dateType==='useby'&&dd<1?'Use-by too short to sell. Reject.':dd<0?'Already past best before.':'');
 return`<div class="line ${l.ticked?'ticked':''} ${l.decision==='reject'?'rej':''}" id="ln${i}">
  <div class="line-top"><button class="tick" data-act="tick" data-i="${i}" aria-label="Tick ${esc(l.name)}" aria-pressed="${l.ticked}">${l.ticked?'✓':''}</button>
   <div style="flex:1;min-width:0"><div class="t" style="font-weight:500">${esc(l.name)}</div><div class="small muted"><span class="num">${l.sku}</span> · ${l.storage} · ordered ${l.ordered}</div></div>
   ${warm?'<span class="pill p-bad">Too warm</span>':iss.includes('short')?'<span class="pill p-warn">Short</span>':''}</div>
  ${l.ticked?`<div class="line-f">
   <label>Qty received<input class="input num" type="number" min="0" inputmode="numeric" data-f="received" data-i="${i}" value="${l.received}"></label>
   ${lim!==null?`<label>Temp °C · ${tempHint}<input class="input num" type="number" step="0.1" inputmode="decimal" data-f="temp" data-i="${i}" value="${l.temp}" placeholder="Probe" style="${warm?'border-color:var(--bad)':''}"></label>`:'<span></span>'}
   <label class="full">${l.dateType==='useby'?'Use-by date':'Best before date'}<input class="input" type="date" data-f="date" data-i="${i}" value="${l.date}"></label>
   ${dateWarn?`<div class="full err" style="margin:0">${dateWarn}</div>`:''}
   ${warm?`<div class="full err" style="margin:0">Above ${lim}°C. Reject this line and tell the driver.</div>`:''}
   <div class="full seg"><button class="acc" data-act="dec" data-v="accept" data-i="${i}" aria-pressed="${l.decision==='accept'}">Accept</button><button class="rej" data-act="dec" data-v="reject" data-i="${i}" aria-pressed="${l.decision==='reject'}">Reject</button></div>
  </div>`:''}</div>`;
}
function redrawLine(i,flash){const el=$('#ln'+i);if(!el)return;el.outerHTML=lineHTML(DW.lines[i],i);if(flash){const n=$('#ln'+i);n.classList.add('flash');n.scrollIntoView({block:'nearest',behavior:'smooth'})}
 const h=document.querySelector('#sheetBody .sheet-h .label');if(h)h.textContent=`Step 2 of 4 · Items · ${DW.lines.filter(l=>l.ticked).length}/${DW.lines.length} ticked`}
function lineChange(e){const t=e.target;if(!t.dataset.f)return;const i=+t.dataset.i,l=DW.lines[i];
 if(t.dataset.f==='received')l.received=Math.max(0,parseInt(t.value)||0);
 if(t.dataset.f==='temp'){l.temp=t.value===''?'':parseFloat(t.value);const lim=tempLimit(l.storage);if(l.temp!==''&&l.temp>lim)l.decision='reject'}
 if(t.dataset.f==='date'){l.date=t.value;if(l.date&&l.dateType==='useby'&&daysUntil(l.date)<1)l.decision='reject'}
 redrawLine(i)}
function doScan(code){
 const i=DW.lines.findIndex(l=>l.sku===code);const inp=$('#scanIn');
 if(i<0){toast(code?'Barcode not on this order':'Enter a barcode');return}
 DW.lines[i].ticked=true;inp.value='';redrawLine(i,true);toast('Scanned: '+DW.lines[i].name);
}
function onPhoto(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),k=240/Math.max(img.width,img.height);c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);DW.photo=c.toDataURL('image/jpeg',.7);drawDW()};img.src=rd.result};rd.readAsDataURL(f)}
function initSig(){
 const c=$('#sig'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
 const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#17201D';
 let down=false;const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)});
 c.addEventListener('pointermove',e=>{if(!down)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();DW.sig=true});
 c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
 DW.sig=false;
}
function dwNext(){
 const err=$('#dwErr');err.textContent='';
 if(DW.step===2){
  const bad=DW.lines.find(l=>l.ticked&&(!l.date||(tempLimit(l.storage)!==null&&(l.temp===''||l.temp==null))));
  if(!DW.lines.some(l=>l.ticked)){err.textContent='Tick or scan at least one item.';return}
  if(bad){err.textContent=`Add the ${!bad.date?'date':'temperature'} for ${bad.name}.`;$('#ln'+DW.lines.indexOf(bad)).scrollIntoView({block:'center',behavior:'smooth'});return}
 }
 DW.step++;drawDW();
}
function dwSave(){
 if(!DW.sig){$('#dwErr').textContent='Sign in the box to confirm the delivery.';return}
 const now=new Date();
 const rec={id:uid(),sup:DW.sup,date:todayStr(),time:hm(now),staff:S.me,lines:DW.lines,checks:DW.checks,photo:DW.photo,notes:DW.notes,signed:true};
 S.deliveries.push(rec);
 let added=0;DW.lines.forEach(l=>{if(l.ticked&&l.decision==='accept'&&l.received>0&&l.date){S.batches.push({id:uid(),name:l.name,qty:l.received,dateType:l.dateType,date:l.date,aisle:l.aisle,cost:l.cost,status:'active',checked:null});added++}});
 save();DW=null;closeSheet();toast(`Delivery saved · ${added} items added to date tracking`);
}

function sheetAddDate(){
 openSheet(head('Add a stock date','For stock already on the shelf')+`
  <label class="field"><span>Product</span><input id="an" class="input" placeholder="For example: Soft tofu 300g"></label>
  <div class="line-f" style="margin:0 0 14px"><label>Quantity<input id="aq" class="input num" type="number" min="1" value="1"></label><label>Location<input id="aa" class="input" placeholder="Chiller 2"></label></div>
  <div class="field"><span>Date type</span><div class="seg"><button class="acc" data-act="atype" data-v="useby" aria-pressed="true">Use by</button><button class="acc" data-act="atype" data-v="bbd" aria-pressed="false">Best before</button></div></div>
  <label class="field"><span>Date</span><input id="ad" class="input" type="date" value="${addDays(7)}"></label>
  <label class="field"><span>Cost each (£)</span><input id="ac" class="input num" type="number" step="0.01" min="0" value="1.00"></label>
  <div class="err" id="aErr"></div><button class="btn primary block" data-act="saveadd">Save</button>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const tab=e.target.closest('[data-tab]');if(tab){TAB=tab.dataset.tab;render();window.scrollTo(0,0);return}
 const go=e.target.closest('[data-go]');if(go&&!e.target.closest('[data-act]')){TAB=go.dataset.go;if(go.dataset.f)DFILTER=go.dataset.f;render();window.scrollTo(0,0);return}
 if(e.target===$('#sheet')){closeSheet();return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
 switch(act){
  case'close':DW=null;closeSheet();break;
  case'staff':sheetStaff();break;
  case'setme':S.me=a.dataset.n;save();closeSheet();toast(`Now recording as ${S.me}`);break;
  case'reset':S=seed();save();render();toast('Demo data reset');break;
  case'rec':sheetRecord(id);break;
  case'tstep':{const i=$('#hotT');const v=parseFloat(i.value);i.value=((isNaN(v)?63:v)+parseFloat(a.dataset.d)).toFixed(1);hotVerdict();break}
  case'savehot':saveHot(id);break;
  case'inspect':sheetInspect();break;
  case'newdel':newDelivery();break;
  case'deldetail':sheetDelDetail(id);break;
  case'pick':DW.sup=id;DW.lines=supById(id).items.map(r=>({...itemOf(id,r[0]),ticked:false,received:r[6],temp:'',date:'',decision:'accept'}));DW.step=2;drawDW();break;
  case'tick':{const i=+a.dataset.i;DW.lines[i].ticked=!DW.lines[i].ticked;redrawLine(i);break}
  case'dec':{const i=+a.dataset.i;DW.lines[i].decision=a.dataset.v;redrawLine(i);break}
  case'simscan':{const i=DW.lines.findIndex(l=>!l.ticked);if(i<0){toast('Everything on the order is ticked');break}$('#scanIn').value=DW.lines[i].sku;setTimeout(()=>doScan(DW.lines[i].sku),250);break}
  case'dwback':DW.step--;drawDW();break;
  case'dwnext':dwNext();break;
  case'sigclear':initSig();break;
  case'dwsave':dwSave();break;
  case'filter':DFILTER=a.dataset.f;render();break;
  case'reduce':{const b=S.batches.find(x=>x.id===id);b.status='reduced';save();render();toast('Marked reduced to clear. Add the yellow price sticker');break}
  case'okq':{const b=S.batches.find(x=>x.id===id);b.checked=todayStr();save();render();toast('Quality checked. OK to keep selling today');break}
  case'remove':sheetRemove(id);break;
  case'doremove':doRemove(id);break;
  case'adddate':sheetAddDate();break;
  case'atype':a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===a));break;
  case'saveadd':{const n=$('#an').value.trim(),q=parseInt($('#aq').value),d=$('#ad').value;
   if(!n||!(q>0)||!d){$('#aErr').textContent='Add a product name, quantity and date.';break}
   const t=document.querySelector('[data-act=atype][aria-pressed=true]').dataset.v;
   S.batches.push({id:uid(),name:n,qty:q,dateType:t,date:d,aisle:$('#aa').value.trim()||'Shop floor',cost:parseFloat($('#ac').value)||0,status:'active',checked:null});
   save();closeSheet();toast('Date added');break}
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden){DW=null;closeSheet()}});
setInterval(()=>{if($('#sheet').hidden)render()},30000);
render();
</script>

</body>
</html>

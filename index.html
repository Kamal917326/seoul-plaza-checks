<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seoul Plaza Checks</title>
<meta name="description" content="Paperless food safety checks: hot food temperatures, delivery check-in, use-by and best before tracking, and waste.">
<meta name="theme-color" content="#2C7A68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Gothic+A1:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <div class="app">
    <header class="top">
      <div class="brand"><small id="shopName">Seoul Plaza</small><h1 id="pageTitle">Today</h1></div>
      <button class="chip-btn" data-act="lock" aria-label="Switch person"><span class="avatar" id="meInit">?</span><span id="meName">Sign in</span></button>
    </header>
    <div class="demo" id="modeBar" hidden></div>
    <main id="view"></main>
  </div>
  <nav class="tabs" aria-label="Sections"><div class="tabs-in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Today<span class="badge" id="b-today" hidden></span></button>
    <button data-tab="hot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13.5V5a2 2 0 1 1 4 0v8.5a4 4 0 1 1-4 0Z"/><path d="M12 9v6.5"/></svg>Hot food<span class="badge" id="b-hot" hidden></span></button>
    <button data-tab="deliveries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg>Deliveries</button>
    <button data-tab="dates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Dates<span class="badge" id="b-dates" hidden></span></button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
  </div></nav>
</div>

<div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="cam" id="cam" hidden><video id="camVideo" playsinline muted></video><div class="cam-frame"></div><p class="cam-msg" id="camMsg">Point the camera at a barcode</p><button class="btn" data-act="camclose">Close camera</button></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
